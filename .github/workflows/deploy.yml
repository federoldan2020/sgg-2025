name: Deploy to UDAP VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Gate liviano: typecheck del frontend. El build real corre en el VPS dentro de deploy.sh.
  guard:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  deploy:
    name: Run deploy.sh on VPS
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} udap.fourdev.com.ar >> ~/.ssh/known_hosts
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts || true

      # deploy.sh corre como root porque pm2 / sgg-backend / sgg-frontend son del root pm2.
      # IMPORTANTE: el secret SSH_PRIVATE_KEY debe ser una clave registrada en
      # /root/.ssh/authorized_keys (la entrada "github-actions-udap").
      # En sesiones no-interactivas nvm no se carga: hay que sourcearlo a mano.
      - name: Execute deploy.sh as root
        run: |
          ssh -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=accept-new \
            root@udap.fourdev.com.ar \
            'bash -c "export NVM_DIR=/root/.nvm && . \$NVM_DIR/nvm.sh && nvm use 20 >/dev/null && bash /var/www/sgg-2025/deploy.sh"'

      - name: Health check
        run: |
          set -e
          echo "Esperando que reinicien los procesos…"
          sleep 8
          code_back=$(curl -s -o /dev/null -w "%{http_code}" https://api.udap.fourdev.com.ar/health || true)
          code_front=$(curl -s -o /dev/null -w "%{http_code}" https://udap.fourdev.com.ar/ || true)
          echo "backend  HTTP $code_back"
          echo "frontend HTTP $code_front"
          if [ "$code_back" != "200" ] && [ "$code_back" != "204" ]; then
            echo "::warning::backend no respondió 200 (got $code_back)"
          fi
          if [ "$code_front" != "200" ] && [ "$code_front" != "307" ] && [ "$code_front" != "308" ]; then
            echo "::warning::frontend no respondió 200/307/308 (got $code_front)"
          fi
