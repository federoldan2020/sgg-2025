name: Deploy to UDAP VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Gates de build/typecheck en paralelo. El build real productivo
  # corre en el VPS dentro de deploy.sh; estos jobs solo validan
  # que el código compila para no deployar algo roto.
  guard-frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  guard-backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      # prisma generate hace falta antes del build para que tsc encuentre los tipos de @prisma/client.
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Build (nest = tsc gate)
        working-directory: backend
        run: npm run build

  deploy:
    name: Run deploy.sh on VPS
    needs: [guard-frontend, guard-backend]
    runs-on: ubuntu-latest
    steps:
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # deploy.sh corre como root porque pm2 / sgg-backend / sgg-frontend son del root pm2.
      # IMPORTANTE: el secret SSH_PRIVATE_KEY debe ser una clave registrada en
      # /root/.ssh/authorized_keys (la entrada "github-actions-udap").
      # accept-new agrega la host key al known_hosts en la primera conexión
      # (más simple y robusto que un ssh-keyscan previo que falla si VPS_PORT está vacío).
      # nvm no se carga en sesiones no-interactivas: hay que sourcearlo a mano.
      - name: Execute deploy.sh as root
        env:
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts \
            root@udap.fourdev.com.ar \
            'bash -c "export NVM_DIR=/root/.nvm && . \$NVM_DIR/nvm.sh && nvm use 20 >/dev/null && bash /var/www/sgg-2025/deploy.sh"'

      - name: Health check
        run: |
          echo "Esperando que reinicien los procesos…"
          sleep 8
          code_back=$(curl -s -o /dev/null -w "%{http_code}" https://api.udap.fourdev.com.ar/health || echo "000")
          code_front=$(curl -s -o /dev/null -w "%{http_code}" https://udap.fourdev.com.ar/ || echo "000")
          echo "backend  HTTP $code_back"
          echo "frontend HTTP $code_front"
          if [ "$code_back" != "200" ] && [ "$code_back" != "204" ]; then
            echo "::warning::backend no respondió 200 (got $code_back)"
          fi
          if [ "$code_front" != "200" ] && [ "$code_front" != "307" ] && [ "$code_front" != "308" ]; then
            echo "::warning::frontend no respondió 200/307/308 (got $code_front)"
          fi
