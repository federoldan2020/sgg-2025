# SGG-2025 / UDAP - Nginx configuration
# Dominios: udap.fourdev.com.ar, www.udap.fourdev.com.ar, api.udap.fourdev.com.ar
# Nota: client_max_body_size suele estar en nginx.conf; si falta, agregar allí

# Upstreams
upstream backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream frontend {
    server 127.0.0.1:3010;
    keepalive 64;
}

# Rate limiting (http context)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=30r/s;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name udap.fourdev.com.ar www.udap.fourdev.com.ar api.udap.fourdev.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API Backend - api.udap.fourdev.com.ar
server {
    listen 443 ssl http2;
    server_name api.udap.fourdev.com.ar;

    ssl_certificate /etc/letsencrypt/live/api.udap.fourdev.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.udap.fourdev.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req zone=api_limit burst=20 nodelay;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend;
        access_log off;
    }
}

# Frontend Next.js - udap.fourdev.com.ar
server {
    listen 443 ssl http2;
    server_name udap.fourdev.com.ar www.udap.fourdev.com.ar;

    ssl_certificate /etc/letsencrypt/live/udap.fourdev.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/udap.fourdev.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req zone=web_limit burst=50 nodelay;

    # Next.js SSR (PM2) en 3010
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
    }

    # Static files caching
    location /_next/static {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
